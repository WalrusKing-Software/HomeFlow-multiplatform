#Project
# Per-component versions — bump only the component being released.
# All three must match for full-suite v* tags (see __docs/BRANCHING.md).
# Bump with: sh scripts/bump-version.sh <server|desktop|android|all>
# See COMPATIBILITY.md for the client–server compatibility matrix.
version.server=0.1.19
version.desktop=0.1.19
version.android=0.1.19

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true