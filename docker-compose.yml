# Production stack. Only Caddy publishes ports; everything else is reachable only
# by service name on the private app-network. `make prod` runs this file alone.
# The dev overlay (docker-compose.dev.yml) is opt-in via `make dev` and is NEVER
# auto-merged. See __docs/DOCKER.md.

services:
  postgres:
    # SEC-09: pinned by manifest-list digest (multi-arch) to prevent tag mutation.
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    container_name: homeflow-postgres-prod
    restart: unless-stopped
    # SEC-07: block privilege escalation (dropping root→postgres still works).
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Consumed by infra/postgres/init/02_create_app_role.sh on first boot.
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [app-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.1@sha256:be6a86215213145bfb4fb3e2b3ab982a806d00262655abdcf3ffa6a38d241c7c
    container_name: homeflow-keycloak-prod
    restart: unless-stopped
    command: start --import-realm
    security_opt:
      - no-new-privileges:true
    environment:
      # SEC-08: management-port health endpoints for the container healthcheck.
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${PUBLIC_KEYCLOAK_URL}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak_data:/opt/keycloak/data
    networks: [app-network]
    depends_on:
      postgres:
        condition: service_healthy
    # SEC-08: the KC image has bash but no curl; /dev/tcp is the documented pattern.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: homeflow-backend-prod
    restart: unless-stopped
    # SEC-07: non-root JVM app on an immutable filesystem; /tmp is the only writable path.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      API_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_APP_USER}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      PUBLIC_KEYCLOAK_URL: ${PUBLIC_KEYCLOAK_URL}
      PUBLIC_KEYCLOAK_REALM: ${PUBLIC_KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
    networks: [app-network]
    depends_on:
      postgres:
        condition: service_healthy
      # SEC-08: wait for Keycloak readiness — the backend fetches JWKS on demand,
      # and starting before KC is up produced avoidable startup 401s/retries.
      keycloak:
        condition: service_healthy
    # SEC-08: TCP connect proves Netty is listening (temurin JRE has bash, no curl).
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: homeflow-caddy-prod
    restart: unless-stopped
    # SEC-07: minimal capabilities — only the low-port bind Caddy actually needs.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_HOSTNAME: ${APP_HOSTNAME}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [app-network]
    depends_on: [backend]

volumes:
  postgres_data:
  keycloak_data:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
