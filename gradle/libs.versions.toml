# Multiplatform Ktor client artifacts for the Compose clients (:app:shared).
# Kept separate from the *-jvm aliases above, which the JVM-only :server uses.
ktor-client-core-mp = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-contentNegotiation-mp = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
