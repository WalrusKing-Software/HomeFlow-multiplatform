<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Warm coral → mauve gradient for background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#F4846B"/>
      <stop offset="55%" stop-color="#D97A7A"/>
      <stop offset="100%" stop-color="#8E6B82"/>
    </linearGradient>

    <!-- Subtle drop shadow for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.18"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded-square app-icon background with gradient -->
  <rect x="20" y="20" width="472" height="472" rx="110" ry="110"
        fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Outer cycle ring - white -->
  <circle cx="256" cy="256" r="170" fill="none"
          stroke="#FFFFFF" stroke-width="18"/>

  <!-- Flow drop (teardrop) - white -->
  <path d="M 256 150
           C 220 200, 200 230, 200 260
           A 56 56 0 0 0 312 260
           C 312 230, 292 200, 256 150 Z"
        fill="none" stroke="#FFFFFF" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wave at bottom - white -->
  <path d="M 130 340
           Q 195 300, 256 340
           T 382 340"
        fill="none" stroke="#FFFFFF" stroke-width="14"
        stroke-linecap="round"/>
</svg>