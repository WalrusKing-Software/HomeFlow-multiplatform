name: Release Desktop

# Builds and publishes HomeFlow desktop installers (Windows MSI, macOS DMG, Linux DEB).
# Triggered by `desktop-vX.Y.Z` tags or workflow_dispatch.
#
# Use this when the desktop app changes but the server and Android client do not
# need a new release. See COMPATIBILITY.md and __docs/RELEASE-PIPELINE.md.

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version X.Y.Z[-pre.N] (defaults to gradle.properties version.desktop)'
        required: false
      prerelease:
        description: 'Mark the GitHub Release as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write   # create the Release and upload assets

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Resolve version + derived values ────────────────────────────────────────
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      version_core: ${{ steps.v.outputs.version_core }}
      desktop_version: ${{ steps.v.outputs.desktop_version }}
      desktop_version_mac: ${{ steps.v.outputs.desktop_version_mac }}
      is_prerelease: ${{ steps.v.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          # 1. Raw version string (strip `desktop-v` prefix from tag).
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            raw="${GITHUB_REF_NAME#desktop-v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            raw="${INPUT_VERSION#v}"
          else
            raw="$(grep -E '^version\.desktop=' gradle.properties | head -n1 | cut -d= -f2 | tr -d ' \t\r')"
          fi
          echo "Resolved raw version: $raw"

          # 2. Validate semver core.
          if [[ ! "$raw" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$raw' is not a valid X.Y.Z[-pre.N] version"; exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          pre="${BASH_REMATCH[4]}"
          core="${major}.${minor}.${patch}"

          # 3. On a tag build, validate against gradle.properties version.desktop.
          gp="$(grep -E '^version\.desktop=' gradle.properties | head -n1 | cut -d= -f2 | tr -d ' \t\r')"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$core" != "$gp" ]]; then
            echo "::error::tag core '$core' != gradle.properties version.desktop '$gp'"
            echo "::error::Bump version.desktop or fix the tag."
            exit 1
          fi

          # 4. Desktop installer version, per platform. Windows MSI / Linux DEB accept 0.x, so
          #    they use the REAL version — pre-1.0 releases then upgrade in place
          #    (0.1.0 < 0.1.1 < 0.2.0 < ... < 1.0.0). macOS dmg/pkg require major >= 1, so a
          #    pre-1.0 build is forced to 1.0.0 there (identify pre-1.0 macOS builds by the
          #    artifact filename); from 1.0.0 on, all platforms track the real version.
          desktop="$core"
          if (( major < 1 )); then desktop_mac="1.0.0"; else desktop_mac="$core"; fi

          # 5. Pre-release?
          if [[ -n "$pre" || "${INPUT_PRERELEASE}" == "true" ]]; then ispre=true; else ispre=false; fi

          {
            echo "version=$raw"
            echo "version_core=$core"
            echo "desktop_version=$desktop"
            echo "desktop_version_mac=$desktop_mac"
            echo "is_prerelease=$ispre"
          } >> "$GITHUB_OUTPUT"

          echo "version=$raw core=$core desktop=$desktop desktop_mac=$desktop_mac prerelease=$ispre"

  # ── Desktop installers, one per OS ──────────────────────────────────────────
  desktop:
    name: Desktop (${{ matrix.fmt }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            fmt: msi
          - os: macos-latest
            fmt: dmg
          - os: ubuntu-latest
            fmt: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve installer version for this OS
        id: iv
        shell: bash
        run: |
          set -euo pipefail
          # macOS (dmg) needs major >= 1; Windows (msi) / Linux (deb) use the real version.
          if [[ "${{ matrix.fmt }}" == "dmg" ]]; then
            iv="${{ needs.prepare.outputs.desktop_version_mac }}"
          else
            iv="${{ needs.prepare.outputs.desktop_version }}"
          fi
          echo "installer_version=$iv" >> "$GITHUB_OUTPUT"
          echo "installer_version=$iv (fmt=${{ matrix.fmt }})"

      - name: Package desktop distribution
        shell: bash
        run: >
          ./gradlew :app:desktopApp:packageDistributionForCurrentOS
          -PdesktopPackageVersion=${{ steps.iv.outputs.installer_version }}
          --no-daemon --no-configuration-cache

      - name: Collect installer
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.prepare.outputs.version }}"
          fmt="${{ matrix.fmt }}"
          src="$(ls app/desktopApp/build/compose/binaries/main/${fmt}/*.${fmt} | head -n1)"
          mkdir -p out
          case "$fmt" in
            dmg) dst="out/HomeFlow-${v}.dmg" ;;
            msi) dst="out/HomeFlow-${v}.msi" ;;
            deb) dst="out/homeflow_${v}_amd64.deb" ;;
          esac
          cp "$src" "$dst"
          echo "Collected $dst (from $src)"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.fmt }}
          path: out/*
          if-no-files-found: error

  # ── Publish GitHub Release (desktop assets only) ─────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: [prepare, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: 'desktop-*'
          merge-multiple: true
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.prepare.outputs.version_core }}"
          awk -v ver="$v" '
            $0 ~ ("^## \\[Desktop " ver "\\]") {flag=1; next}
            flag && /^## \[/ {flag=0}
            flag {print}
          ' CHANGELOG.md > release-notes.md || true
          if [[ ! -s release-notes.md ]]; then
            echo "Desktop release ${{ needs.prepare.outputs.version }}." > release-notes.md
          fi
          echo "----- release notes -----"; cat release-notes.md
      - name: Attach setup documentation
        shell: bash
        run: cp __docs/SETUP-DESKTOP.md assets/SETUP-DESKTOP.md
      - name: List collected assets
        shell: bash
        run: ls -lR assets
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', needs.prepare.outputs.version) }}
          name: HomeFlow Desktop ${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          make_latest: false
          files: assets/**
          fail_on_unmatched_files: true
