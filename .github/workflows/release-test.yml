name: Release Test

# Test build of all three HomeFlow deliverables (server, desktop, Android).
# Identical build logic to release.yml but:
#   - Triggered by push to the persistent `release-test` branch, or workflow_dispatch.
#   - Version is `X.Y.Z-test.<short-sha>` — clearly a test build, no collision with tags.
#   - Server image pushed to GHCR with `test-<sha>` tag only (never `latest`).
#   - No GitHub Release created — artifacts are downloadable from the Actions run
#     "Artifacts" section for 7 days after the run.
#
# Workflow:
#   git switch release-test && git merge --ff-only <branch-to-test> && git push
#   → pipeline fires → download artifacts and/or docker pull the test image on the Pi.
#
# See __docs/RELEASE-PIPELINE.md for the full pipeline design.

on:
  push:
    branches: ['release-test']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-test-${{ github.ref }}
  cancel-in-progress: true   # safe to cancel superseded test builds

jobs:
  # ── Resolve version + derived values ────────────────────────────────────────
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      version_core: ${{ steps.v.outputs.version_core }}
      desktop_version: ${{ steps.v.outputs.desktop_version }}
      android_version_code: ${{ steps.v.outputs.android_version_code }}
      image: ${{ steps.v.outputs.image }}
      sha7: ${{ steps.v.outputs.sha7 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          core="$(grep -E '^version\.server=' gradle.properties | head -n1 | cut -d= -f2 | tr -d ' \t\r')"
          sha7="${GITHUB_SHA::7}"
          version="${core}-test.${sha7}"

          if [[ ! "$core" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::gradle.properties version '$core' is not X.Y.Z"; exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          # Desktop installer version. jpackage/macOS require major >= 1. For TEST builds every
          # run reuses the same source version (e.g. 0.1.0), which would produce an identical
          # installer version every time — and Windows Installer only upgrades in place when the
          # version INCREASES, so reinstalling a test MSI over a previous one would be a silent
          # no-op (old app files kept). Make it monotonic per build using the workflow run number
          # so each test MSI supersedes the last. The real version is still in the artifact
          # filename (HomeFlow-<version>.msi). Real releases use the semantic version instead.
          desktop="1.0.${GITHUB_RUN_NUMBER}"
          code=$(( major * 1000000 + minor * 1000 + patch ))
          image="ghcr.io/${GITHUB_REPOSITORY,,}-server"

          {
            echo "version=$version"
            echo "version_core=$core"
            echo "desktop_version=$desktop"
            echo "android_version_code=$code"
            echo "image=$image"
            echo "sha7=$sha7"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version desktop=$desktop code=$code image=$image"

  # ── Server: distribution archives + test image ──────────────────────────────
  server:
    name: Server (dist + image)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install required SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build server distribution
        run: ./gradlew :server:installDist --no-daemon --no-configuration-cache

      - name: Package distribution archives
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.prepare.outputs.version }}"
          mkdir -p dist-out
          ( cd server/build/install && zip -qr "$GITHUB_WORKSPACE/dist-out/homeflow-server-${v}.zip" server )
          tar -czf "dist-out/homeflow-server-${v}.tar.gz" -C server/build/install server
          ls -l dist-out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-dist
          path: dist-out/*
          retention-days: 7
          if-no-files-found: error

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build & push test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server/build/install/server
          file: server/Dockerfile.dist
          platforms: linux/amd64,linux/arm64
          push: true
          # test-<sha> only — never moves :latest
          tags: ${{ needs.prepare.outputs.image }}:test-${{ needs.prepare.outputs.sha7 }}
          build-args: SERVER_VERSION=${{ needs.prepare.outputs.version }}
          provenance: false

      - name: Print pull command
        shell: bash
        run: |
          echo "::notice::To test on the Pi:"
          echo "::notice::  docker pull ${{ needs.prepare.outputs.image }}:test-${{ needs.prepare.outputs.sha7 }}"

  # ── Desktop installers, one per OS ──────────────────────────────────────────
  desktop:
    name: Desktop (${{ matrix.fmt }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            fmt: msi
          - os: macos-latest
            fmt: dmg
          - os: ubuntu-latest
            fmt: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install required SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Package desktop distribution
        shell: bash
        run: >
          ./gradlew :app:desktopApp:packageDistributionForCurrentOS
          -PdesktopPackageVersion=${{ needs.prepare.outputs.desktop_version }}
          --no-daemon --no-configuration-cache

      - name: Collect installer
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.prepare.outputs.version }}"
          fmt="${{ matrix.fmt }}"
          src="$(ls app/desktopApp/build/compose/binaries/main/${fmt}/*.${fmt} | head -n1)"
          mkdir -p out
          case "$fmt" in
            dmg) dst="out/HomeFlow-${v}.dmg" ;;
            msi) dst="out/HomeFlow-${v}.msi" ;;
            deb) dst="out/homeflow_${v}_amd64.deb" ;;
          esac
          cp "$src" "$dst"
          echo "Collected $dst (from $src)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.fmt }}
          path: out/*
          retention-days: 7
          if-no-files-found: error

  # ── Android signed APK + AAB ────────────────────────────────────────────────
  android:
    name: Android (apk + aab)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install required SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Write signing keystore (if secrets present)
        id: signing
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KS_B64}" ]]; then
            echo "No keystore secret — building UNSIGNED APK."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "${KS_B64}" | base64 -d > homeflow-release.jks
          cat > keystore.properties <<EOF
          storeFile=homeflow-release.jks
          storePassword=${KS_PW}
          keyAlias=${KS_ALIAS}
          keyPassword=${KS_KEY_PW}
          EOF
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK + AAB
        shell: bash
        run: >
          ./gradlew :app:androidApp:assembleRelease :app:androidApp:bundleRelease
          -PversionCode=${{ needs.prepare.outputs.android_version_code }}
          --no-daemon --no-configuration-cache

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.prepare.outputs.version }}"
          mkdir -p out
          apk="$(ls app/androidApp/build/outputs/apk/release/*.apk | head -n1)"
          aab="$(ls app/androidApp/build/outputs/bundle/release/*.aab | head -n1)"
          cp "$apk" "out/homeflow-android-${v}.apk"
          cp "$aab" "out/homeflow-android-${v}.aab"
          echo "Collected APK=$apk AAB=$aab (signed=${{ steps.signing.outputs.enabled }})"

      - name: Clean up signing material
        if: always()
        shell: bash
        run: rm -f homeflow-release.jks keystore.properties

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: out/*
          retention-days: 7
          if-no-files-found: error
