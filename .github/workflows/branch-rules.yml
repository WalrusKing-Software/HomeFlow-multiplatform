name: Branch Rules

# Enforces the branching MODEL that GitHub's native branch protection cannot:
# protection rules can require a PR, but they cannot restrict which *source*
# branch a PR is allowed to come from. This check fails the PR when the
# head -> base flow is not allowed.
#
#   main               <-  release/x.y.z | develop        (release PRs + develop back-merge)
#   release/*          <-  develop-* | feature/* | bugfix/*
#   develop | develop-* <- feature/* | bugfix/* | docs/* | chore/* | dependabot/*
#                          | main | release/*             (work branches + back-merges)
#
# develop-* is the integration branch for the next release: work branches merge
# into it while the version number is still undecided, then it lands on a
# release/x.y.z branch as a single clean commit. Single-train model (server +
# desktop + android ship together). See __docs/BRANCHING.md.

on:
  pull_request:
    branches:
      - main
      - 'release/*'
      - develop
      - 'develop-*'

permissions:
  contents: read

jobs:
  validate-branch-flow:
    name: validate-branch-flow
    runs-on: ubuntu-latest
    steps:
      - name: Enforce source -> target branch policy
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "Pull request: '$HEAD'  ->  '$BASE'"
          fail() { echo "::error::$1"; exit 1; }

          case "$BASE" in
            main)
              # release/x.y.z, with an optional 'v' prefix and optional pre-release
              # qualifier (e.g. release/0.1.0, release/v0.1.0, release/v0.1.0-alpha-1).
              # 'develop' is also allowed as a post-release back-merge into main.
              if [[ "$HEAD" =~ ^release/v?[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ || "$HEAD" == "develop" ]]; then
                echo "OK: PR into 'main' from '$HEAD' (release promotion or develop back-merge)."
              else
                fail "Only 'release/x.y.z' branches (optionally 'v'-prefixed and/or with a pre-release suffix) or 'develop' (back-merge) may be merged into 'main' (got head '$HEAD')."
              fi
              ;;
            release/*)
              if [[ "$HEAD" =~ ^develop-.+ || "$HEAD" =~ ^(feature|bugfix)/.+ ]]; then
                echo "OK: PR into '$BASE' from '$HEAD' (develop integration or work/hotfix branch)."
              else
                fail "Only 'develop-*' (or 'feature/*'/'bugfix/*' for hotfixes) may be merged into '$BASE' (got head '$HEAD')."
              fi
              ;;
            develop|develop-*)
              # dependabot/* are Dependabot's dependency-bump branches (SEC-14) —
              # they integrate like work branches and pass the same CI gates.
              # 'main' and 'release/*' are allowed as post-release back-merges so the
              # integration branch can re-absorb the release commits.
              if [[ "$HEAD" =~ ^(feature|bugfix|docs|dependabot|chore)/.+ || "$HEAD" == "main" || "$HEAD" =~ ^release/.+ ]]; then
                echo "OK: PR into '$BASE' from '$HEAD' (work branch, or main/release back-merge)."
              else
                fail "Only 'feature/*', 'bugfix/*', 'docs/*', 'dependabot/*', 'chore/*', 'main' (back-merge), or 'release/*' (back-merge) branches may be merged into '$BASE' (got head '$HEAD')."
              fi
              ;;
            *)
              echo "No branch-flow rule defined for base '$BASE'; nothing to enforce."
              ;;
          esac
