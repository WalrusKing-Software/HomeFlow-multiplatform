name: Secret Scan (gitleaks)

# Scans the repository (working tree + full git history) for committed secrets,
# using the repo's own .gitleaks.toml (same config the Husky pre-commit hook
# and scripts/check-secrets.sh use). Runs the gitleaks Docker image directly so
# it stays free on private repos and identical to the documented local command.

on:
  pull_request:
    branches:
      - main
      - 'release/*'
      - develop
      - 'develop-*'
  push:
    branches:
      - main
      - 'release/*'
      - develop
      - 'develop-*'

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Full history so the scan covers every commit, not just the tip.
          fetch-depth: 0
      - name: Run gitleaks
        # SEC-09/14: pinned version — 'latest' could silently change scanner behavior.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect \
              --source=/repo \
              --config=/repo/.gitleaks.toml \
              --redact \
              --exit-code 1 \
              --verbose
