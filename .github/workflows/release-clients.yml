name: Release Clients

# Builds and publishes BOTH client apps — desktop installers (Windows MSI, macOS
# DMG, Linux DEB) and the Android APK/AAB — as a single GitHub Release, WITHOUT
# touching the server.
#
# Use this when a change lands in :app:shared (or in both platform apps) and you
# want to ship desktop + Android together on their own cadence, independent of the
# server release train. For a single-platform change use release-desktop.yml or
# release-android.yml instead; for a server change use release-server.yml.
# See COMPATIBILITY.md and __docs/RELEASE-PIPELINE.md.

on:
  push:
    tags: ['clients-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version X.Y.Z[-pre.N] (defaults to gradle.properties version.desktop)'
        required: false
      prerelease:
        description: 'Mark the GitHub Release as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write   # create the Release and upload assets

concurrency:
  group: release-clients-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Resolve version + derived values ────────────────────────────────────────
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      version_core: ${{ steps.v.outputs.version_core }}
      desktop_version: ${{ steps.v.outputs.desktop_version }}
      desktop_version_mac: ${{ steps.v.outputs.desktop_version_mac }}
      android_version_code: ${{ steps.v.outputs.android_version_code }}
      is_prerelease: ${{ steps.v.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          # 1. Raw version string (strip `clients-v` prefix from tag).
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            raw="${GITHUB_REF_NAME#clients-v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            raw="${INPUT_VERSION#v}"
          else
            raw="$(grep -E '^version\.desktop=' gradle.properties | head -n1 | cut -d= -f2 | tr -d ' \t\r')"
          fi
          echo "Resolved raw version: $raw"

          # 2. Validate semver core.
          if [[ ! "$raw" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$raw' is not a valid X.Y.Z[-pre.N] version"; exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          pre="${BASH_REMATCH[4]}"
          core="${major}.${minor}.${patch}"

          # 3. This is a COMBINED client release: version.desktop and version.android
          #    in gradle.properties must already match each other and match the tag
          #    core. This is what keeps "clients" meaning "both, in lockstep" instead
          #    of silently shipping a stale Android or desktop build under one tag.
          gp_desktop="$(grep -E '^version\.desktop=' gradle.properties | head -n1 | cut -d= -f2 | tr -d ' \t\r')"
          gp_android="$(grep -E '^version\.android=' gradle.properties | head -n1 | cut -d= -f2 | tr -d ' \t\r')"
          if [[ "$gp_desktop" != "$gp_android" ]]; then
            echo "::error::version.desktop ($gp_desktop) != version.android ($gp_android) in gradle.properties"
            echo "::error::A clients release ships both in lockstep — run 'sh scripts/bump-version.sh clients' first."
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$core" != "$gp_desktop" ]]; then
            echo "::error::tag core '$core' != gradle.properties version.desktop/version.android '$gp_desktop'"
            echo "::error::Bump both client versions or fix the tag."
            exit 1
          fi

          # 4. Desktop installer version, per platform (see release-desktop.yml).
          desktop="$core"
          if (( major < 1 )); then desktop_mac="1.0.0"; else desktop_mac="$core"; fi

          # 5. Android versionCode: monotonic integer from the core.
          code=$(( major * 1000000 + minor * 1000 + patch ))

          # 6. Pre-release?
          if [[ -n "$pre" || "${INPUT_PRERELEASE}" == "true" ]]; then ispre=true; else ispre=false; fi

          {
            echo "version=$raw"
            echo "version_core=$core"
            echo "desktop_version=$desktop"
            echo "desktop_version_mac=$desktop_mac"
            echo "android_version_code=$code"
            echo "is_prerelease=$ispre"
          } >> "$GITHUB_OUTPUT"

          echo "version=$raw core=$core desktop=$desktop desktop_mac=$desktop_mac code=$code prerelease=$ispre"

  # ── Desktop installers, one per OS ──────────────────────────────────────────
  desktop:
    name: Desktop (${{ matrix.fmt }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            fmt: msi
          - os: macos-latest
            fmt: dmg
          - os: ubuntu-latest
            fmt: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install required SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Resolve installer version for this OS
        id: iv
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.fmt }}" == "dmg" ]]; then
            iv="${{ needs.prepare.outputs.desktop_version_mac }}"
          else
            iv="${{ needs.prepare.outputs.desktop_version }}"
          fi
          echo "installer_version=$iv" >> "$GITHUB_OUTPUT"
          echo "installer_version=$iv (fmt=${{ matrix.fmt }})"

      - name: Package desktop distribution
        shell: bash
        run: >
          ./gradlew :app:desktopApp:packageDistributionForCurrentOS
          -PdesktopPackageVersion=${{ steps.iv.outputs.installer_version }}
          --no-daemon --no-configuration-cache

      - name: Collect installer
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.prepare.outputs.version }}"
          fmt="${{ matrix.fmt }}"
          src="$(ls app/desktopApp/build/compose/binaries/main/${fmt}/*.${fmt} | head -n1)"
          mkdir -p out
          case "$fmt" in
            dmg) dst="out/HomeFlow-${v}.dmg" ;;
            msi) dst="out/HomeFlow-${v}.msi" ;;
            deb) dst="out/homeflow_${v}_amd64.deb" ;;
          esac
          cp "$src" "$dst"
          echo "Collected $dst (from $src)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.fmt }}
          path: out/*
          if-no-files-found: error

  # ── Android signed APK + AAB ────────────────────────────────────────────────
  android:
    name: Android (apk + aab)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install required SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Write signing keystore (if secrets present)
        id: signing
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KS_B64}" ]]; then
            echo "No keystore secret — building UNSIGNED APK."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "${KS_B64}" | base64 -d > homeflow-release.jks
          cat > keystore.properties <<EOF
          storeFile=homeflow-release.jks
          storePassword=${KS_PW}
          keyAlias=${KS_ALIAS}
          keyPassword=${KS_KEY_PW}
          EOF
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK + AAB
        shell: bash
        run: >
          ./gradlew :app:androidApp:assembleRelease :app:androidApp:bundleRelease
          -PversionCode=${{ needs.prepare.outputs.android_version_code }}
          --no-daemon --no-configuration-cache

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.prepare.outputs.version }}"
          mkdir -p out
          apk="$(ls app/androidApp/build/outputs/apk/release/*.apk | head -n1)"
          aab="$(ls app/androidApp/build/outputs/bundle/release/*.aab | head -n1)"
          cp "$apk" "out/homeflow-android-${v}.apk"
          cp "$aab" "out/homeflow-android-${v}.aab"
          echo "Collected APK=$apk AAB=$aab (signed=${{ steps.signing.outputs.enabled }})"

      - name: Clean up signing material
        if: always()
        shell: bash
        run: rm -f homeflow-release.jks keystore.properties

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: out/*
          if-no-files-found: error

  # ── Publish one GitHub Release (desktop + Android assets, no server) ────────
  publish:
    name: Publish GitHub Release
    needs: [prepare, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
          merge-multiple: true
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.prepare.outputs.version_core }}"
          # Prefer a combined "## [Clients X.Y.Z]" entry; fall back to concatenating
          # separate Desktop/Android entries if that's what was written instead.
          awk -v ver="$v" '
            $0 ~ ("^## \\[Clients " ver "\\]") {flag=1; next}
            flag && /^## \[/ {flag=0}
            flag {print}
          ' CHANGELOG.md > release-notes.md || true
          if [[ ! -s release-notes.md ]]; then
            {
              awk -v ver="$v" '
                $0 ~ ("^## \\[Desktop " ver "\\]") {flag=1; next}
                flag && /^## \[/ {flag=0}
                flag {print}
              ' CHANGELOG.md
              awk -v ver="$v" '
                $0 ~ ("^## \\[Android " ver "\\]") {flag=1; next}
                flag && /^## \[/ {flag=0}
                flag {print}
              ' CHANGELOG.md
            } > release-notes.md || true
          fi
          if [[ ! -s release-notes.md ]]; then
            echo "Clients release ${{ needs.prepare.outputs.version }}." > release-notes.md
          fi
          echo "----- release notes -----"; cat release-notes.md
      - name: Attach setup documentation
        shell: bash
        run: |
          cp __docs/SETUP-DESKTOP.md assets/SETUP-DESKTOP.md
          cp __docs/SETUP-ANDROID.md assets/SETUP-ANDROID.md
      - name: List collected assets
        shell: bash
        run: ls -lR assets
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('clients-v{0}', needs.prepare.outputs.version) }}
          name: HomeFlow Clients ${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          make_latest: false
          files: assets/**
          fail_on_unmatched_files: true
