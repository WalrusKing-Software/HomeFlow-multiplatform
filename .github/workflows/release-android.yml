name: Release Android

# Builds and publishes the HomeFlow Android APK and AAB.
# Triggered by `android-vX.Y.Z` tags or workflow_dispatch.
#
# Use this when the Android app changes but the server and desktop client do not
# need a new release. See COMPATIBILITY.md and __docs/RELEASE-PIPELINE.md.

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version X.Y.Z[-pre.N] (defaults to gradle.properties version.android)'
        required: false
      prerelease:
        description: 'Mark the GitHub Release as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write   # create the Release and upload assets

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Resolve version + derived values ────────────────────────────────────────
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      version_core: ${{ steps.v.outputs.version_core }}
      android_version_code: ${{ steps.v.outputs.android_version_code }}
      is_prerelease: ${{ steps.v.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          # 1. Raw version string (strip `android-v` prefix from tag).
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            raw="${GITHUB_REF_NAME#android-v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            raw="${INPUT_VERSION#v}"
          else
            raw="$(grep -E '^version\.android=' gradle.properties | head -n1 | cut -d= -f2 | tr -d ' \t\r')"
          fi
          echo "Resolved raw version: $raw"

          # 2. Validate semver core.
          if [[ ! "$raw" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$raw' is not a valid X.Y.Z[-pre.N] version"; exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          pre="${BASH_REMATCH[4]}"
          core="${major}.${minor}.${patch}"

          # 3. On a tag build, validate against gradle.properties version.android.
          gp="$(grep -E '^version\.android=' gradle.properties | head -n1 | cut -d= -f2 | tr -d ' \t\r')"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$core" != "$gp" ]]; then
            echo "::error::tag core '$core' != gradle.properties version.android '$gp'"
            echo "::error::Bump version.android or fix the tag."
            exit 1
          fi

          # 4. Android versionCode: monotonic integer from the core.
          code=$(( major * 1000000 + minor * 1000 + patch ))

          # 5. Pre-release?
          if [[ -n "$pre" || "${INPUT_PRERELEASE}" == "true" ]]; then ispre=true; else ispre=false; fi

          {
            echo "version=$raw"
            echo "version_core=$core"
            echo "android_version_code=$code"
            echo "is_prerelease=$ispre"
          } >> "$GITHUB_OUTPUT"

          echo "version=$raw core=$core code=$code prerelease=$ispre"

  # ── Android signed APK + AAB ────────────────────────────────────────────────
  android:
    name: Android (apk + aab)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install required SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4

      - name: Write signing keystore (if secrets present)
        id: signing
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KS_B64}" ]]; then
            echo "No keystore secret — building UNSIGNED APK."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "${KS_B64}" | base64 -d > homeflow-release.jks
          cat > keystore.properties <<EOF
          storeFile=homeflow-release.jks
          storePassword=${KS_PW}
          keyAlias=${KS_ALIAS}
          keyPassword=${KS_KEY_PW}
          EOF
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK + AAB
        shell: bash
        run: >
          ./gradlew :app:androidApp:assembleRelease :app:androidApp:bundleRelease
          -PversionCode=${{ needs.prepare.outputs.android_version_code }}
          --no-daemon --no-configuration-cache

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.prepare.outputs.version }}"
          mkdir -p out
          apk="$(ls app/androidApp/build/outputs/apk/release/*.apk | head -n1)"
          aab="$(ls app/androidApp/build/outputs/bundle/release/*.aab | head -n1)"
          cp "$apk" "out/homeflow-android-${v}.apk"
          cp "$aab" "out/homeflow-android-${v}.aab"
          echo "Collected APK=$apk AAB=$aab (signed=${{ steps.signing.outputs.enabled }})"

      - name: Clean up signing material
        if: always()
        shell: bash
        run: rm -f homeflow-release.jks keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          if-no-files-found: error

  # ── Publish GitHub Release (Android assets only) ─────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: [prepare, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: 'android'
          merge-multiple: true
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.prepare.outputs.version_core }}"
          awk -v ver="$v" '
            $0 ~ ("^## \\[Android " ver "\\]") {flag=1; next}
            flag && /^## \[/ {flag=0}
            flag {print}
          ' CHANGELOG.md > release-notes.md || true
          if [[ ! -s release-notes.md ]]; then
            echo "Android release ${{ needs.prepare.outputs.version }}." > release-notes.md
          fi
          echo "----- release notes -----"; cat release-notes.md
      - name: Attach setup documentation
        shell: bash
        run: cp __docs/SETUP-ANDROID.md assets/SETUP-ANDROID.md
      - name: List collected assets
        shell: bash
        run: ls -lR assets
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('android-v{0}', needs.prepare.outputs.version) }}
          name: HomeFlow Android ${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          make_latest: false
          files: assets/**
          fail_on_unmatched_files: true
